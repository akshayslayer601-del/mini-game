[build]
  command = "bash netlify-build.sh"
  publish = "web"

[build.environment]
  GODOT_VERSION = "4.7.2"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
  for = "/*.pck"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public,max-age=31536000,immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
